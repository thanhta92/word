<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103f82" />
      <stop offset="100%" stop-color="#185abd" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b7cd3" />
      <stop offset="100%" stop-color="#185abd" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base App Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />

  <!-- Document Sheet Layer (Back) -->
  <g filter="url(#shadow)">
    <rect x="230" y="80" width="190" height="352" rx="20" fill="url(#cardGrad)" />
    <!-- Document lines on sheet -->
    <rect x="260" y="140" width="130" height="18" rx="9" fill="#ffffff" opacity="0.8" />
    <rect x="260" y="190" width="130" height="18" rx="9" fill="#ffffff" opacity="0.6" />
    <rect x="260" y="240" width="130" height="18" rx="9" fill="#ffffff" opacity="0.6" />
    <rect x="260" y="290" width="90" height="18" rx="9" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Word Tile Front (Iconic W Box) -->
  <g filter="url(#shadow)">
    <rect x="80" y="96" width="220" height="320" rx="32" fill="#185abd" stroke="#2b7cd3" stroke-width="4" />
    <!-- Letter W in crisp bold geometry -->
    <path d="M 120 180 L 155 330 L 185 330 L 210 230 L 235 330 L 265 330 L 300 180 L 268 180 L 250 280 L 225 180 L 195 180 L 170 280 L 152 180 Z" fill="#ffffff" />
  </g>

  <!-- Cloud Sync Subtle Icon at top right -->
  <g transform="translate(370, 70) scale(0.9)" opacity="0.95">
    <circle cx="20" cy="20" r="26" fill="#107c41" />
    <path d="M 12 20 L 18 26 L 30 14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
